# Session PATH for the systemd user manager.
#
# This exists because of a specific failure: under uwsm, Hyprland is started BY
# the systemd user manager, so waybar, fuzzel and every keybind inherit systemd's
# environment -- not the shell's. ~/.zshenv is never read there. Without this
# file, every `ergon-*` reference in waybar/config.jsonc and hypr/common/*.lua
# resolves to nothing: the bar module shows no output, the keybind does nothing,
# and the only trace is a "command not found" in the compositor log.
#
# environment.d is read by `systemd --user` at session start, and supports
# ${VAR} expansion against the inherited environment, which is what makes
# prepending to PATH possible here rather than replacing it.
#
# NOTE: changes need `systemctl --user daemon-reload` AND a new session -- the
# already-running manager does not re-read this.
PATH=$HOME/ergonOS/bin:$HOME/.local/bin:$PATH
