# Theia answers ds9's scripting names, so unmodified ds9 scripts drive it.
#
# Theia registers its XPA access points (DS9:ds9, DS9:fitsviewer) privately by
# default: one 0700 directory per instance that only `theiactl` reaches. That
# leaves every existing `xpaset -p ds9 ...` script and every pyds9 call talking
# to nobody. (pyds9 must still name its target, DS9("DS9:ds9"): Theia also
# registers DS9:fitsviewer, so a bare DS9() finds two and raises.)
# THEIA_XPA=public registers them the way ds9 itself does
# (ERGON-73, operator's call 2026-10-01). It also outranks Theia's own
# Settings -> DS9 scripts choice, so opting out is a later file in
# ~/.config/environment.d setting THEIA_XPA=private, not the Settings window.
#
# XPA_METHOD=localhost is what keeps "public" local. libxpa's default method is
# inet on EVERY interface: measured, xpans on 0.0.0.0:14285/14286 and each
# access point on a random 0.0.0.0 port. The firewall drops that from the LAN
# but not from tailscale0, which it trusts, so any tailnet host could have
# opened files in, and quit, the viewer. localhost is the same TCP transport
# bound to 127.0.0.1 only, and a client with no XPA_METHOD set at all still
# reaches it (measured). See `ergon explain security`.
#
# Needs a new session: the running systemd user manager does not re-read this.
THEIA_XPA=public
XPA_METHOD=localhost
