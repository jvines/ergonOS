# xdg-desktop-portal-hyprland's own config (hyprlang, read from
# ~/.config/hypr/xdph.conf). ERGON-159: the stock picker needs a GPU EGL stack
# that software rendering lacks; ergon-share-picker runs it when it can and a
# fuzzel list when it cannot. It is found on the session PATH
# (environment.d/10-ergon-path.conf), which the portal inherits.
screencopy {
  custom_picker_binary = ergon-share-picker
}
