# GENERATED from hypr/hyprlock.conf.in — edit the .in, then run: ergon theme
#
# Lock screen. hyprlang, not Lua: only Hyprland itself moved to Lua at 0.55, the
# satellite daemons (hyprlock, hypridle, hyprpaper) still parse hyprlang.
#
# No blur, no screenshot background. A blurred snapshot of the desktop is a
# readable snapshot of the desktop — window titles and terminal text survive a
# blur far better than people assume, and this machine has cluster credentials
# and unpublished data on screen. Solid colour instead.

general {
    hide_cursor = true
    ignore_empty_input = true
    # Typing straight into the password field without hitting a key to wake the
    # prompt first. Matters when the lid opens and you are already typing.
    immediate_render = true
}

# No fingerprint block here on purpose. The password is the one unlock method
# every machine has, so it is the only one the shipped config assumes.
#
# This used to carry `fingerprint { enabled = true; ready_message = touch the
# power button }` unconditionally. Most computers have no fingerprint reader at
# all, and of the ones that do, the reader is in the power button on a Framework
# and somewhere else entirely on a ThinkPad or a Dell -- so the lock screen told
# a desktop user to press the button that turns the machine off.
#
# Fingerprint unlock is opt-in after enrolment, which is the only moment a
# reader is known to exist AND to have prints on it. `ergon fingerprint` prints
# the block to add once enrolling succeeds.

animations {
    enabled = true
    bezier = out, 0.2, 0.9, 0.2, 1.0
    animation = fadeIn, 1, 3, out
    animation = inputFieldDots, 1, 1.5, out
}

background {
    monitor =
    color = rgb(1A1A2E)
    blur_passes = 0
}

# Clock. Large, because the most common reason to look at a locked laptop is to
# find out how long the sampler has been running.
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = rgb(EDEDF8)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B"
    color = rgb(A6A6BC)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 185
    halign = center
    valign = center
}

# Host and battery. On a machine that hibernates rather than shuts down, coming
# back to a locked screen at 4% is a real scenario, and you want to know before
# you start typing a passphrase.
#
# `ergon battery --short` does the discovery (no BAT1 hardcode -- some
# machines are BAT0, some have two) and prints AC on a desktop with no
# battery at all. The previous inline `|| echo AC` never actually ran: a
# pipeline's exit status is its last command's, sed's here, not the capacity
# read's, so a missing BAT1 produced an empty label rather than "AC".
label {
    monitor =
    text = cmd[update:30000] printf '%s   %s' "$(hostname -s)" "$(ergon battery --short 2>/dev/null)"
    color = rgb(9494B0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = rgb(3A3A4E)
    inner_color = rgb(2A2A3E)
    font_color  = rgb(EDEDF8)
    check_color = rgb(ADFFFF)
    fail_color  = rgb(FF40FF)
    capslock_color = rgb(EBC2FF)

    fade_on_empty = false
    rounding = 4
    # WORDS, not a glyph. This was a lone nerd-font icon, which renders as an
    # empty box on a field that also has no caret -- so the lock screen showed a
    # blank dark rectangle with nothing to say it accepts typing. Someone looking
    # at this machine for the first time asked how they were supposed to unlock
    # it, and the honest answer was "type into the part that looks inert".
    #
    # $USER so it is clear WHICH account is being unlocked, which matters on a
    # machine that also has a greeter.
    placeholder_text = <span foreground="##9494B0">Password for $USER</span>
    fail_text = <span foreground="##FF40FF">$FAIL ($ATTEMPTS)</span>
    hide_input = false

    position = 0, 60
    halign = center
    valign = center
}
