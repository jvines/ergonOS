# Wallpaper. One image, preloaded once, applied to every output.
#
# The image is GENERATED, not committed: bin/ergon-wallpaper writes it from
# theme/cool.env at the panel's own resolution. It is derived, binary and
# machine-specific, so the repo holds the recipe and not the output.
#
# If it is missing, hyprpaper logs and exits and you get the compositor's
# background_color from looknfeel instead -- which is the same COOL_BG0, so a
# missing wallpaper degrades to a plain dark desktop rather than to black.

preload = ~/.local/share/ergon/wallpaper.png
wallpaper = , ~/.local/share/ergon/wallpaper.png

# The panel is the battery cost, not the image. splash draws the Hyprland logo
# over it; ipc lets ergon-wallpaper swap without a restart.
splash = false
ipc = on
