# Idle behaviour. hyprlang, not Lua — see the note in hyprlock.conf.in.
#
# NOTE WHAT IS NOT HERE: there is no idle suspend, and that is deliberate.
# This machine's whole reason for existing is running samplers that think for
# hours without touching an input device. hypridle cannot tell "idle" from
# "busy with no keyboard", so an idle-suspend rule here would suspend the box
# mid-chain. Suspend is the lid, or a deliberate command — both of which mean a
# human decided.
#
# What IS here is screen and lock, which cost nothing to get wrong.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # DPMS does not always come back on its own after a resume on amdgpu.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.exec_raw("dpms on")'
    ignore_dbus_inhibit = false      # mpv/firefox inhibitors are respected
    ignore_systemd_inhibit = false
}

# 4 min — dim. Cheap, instantly reversible, and the warning that the lock is
# coming. brightnessctl -s saves the level so -r restores whatever you had.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# Keyboard backlight follows the panel.
listener {
    timeout = 240
    on-timeout = brightnessctl -sd tpacpi::kbd_backlight set 0 2>/dev/null || true
    on-resume  = brightnessctl -rd tpacpi::kbd_backlight 2>/dev/null || true
}

# 10 min — lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 12 min — panel off. Two minutes after the lock so the screen does not go black
# in the same motion that hides your session; that gap is what tells you the
# machine locked rather than crashed.
listener {
    timeout = 720
    on-timeout = hyprctl dispatch 'hl.dsp.exec_raw("dpms off")'
    on-resume  = hyprctl dispatch 'hl.dsp.exec_raw("dpms on")'
}
