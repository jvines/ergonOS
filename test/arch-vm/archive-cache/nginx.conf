# Caching proxy for archive.archlinux.org, for the CI VM suite only (ERGON-127
# follow-up). A dated snapshot under /repos/YYYY/MM/DD/ never changes, so every
# 200 is kept for a year. Nothing shipped points here: the harness hands the
# URL to the guest as ERGON_ARCHIVE_URL when this answers.
worker_processes 2;
events { worker_connections 256; }
http {
  proxy_cache_path /cache levels=1:2 keys_zone=archive:64m max_size=80g inactive=365d use_temp_path=off;
  # Docker's embedded resolver is not used on the default bridge; ask a public one.
  resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
  access_log /dev/stdout combined;
  server {
    listen 80;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / {
      proxy_pass https://archive.archlinux.org;
      proxy_ssl_server_name on;
      proxy_set_header Host archive.archlinux.org;
      proxy_cache archive;
      proxy_cache_valid 200 365d;
      proxy_cache_valid 404 1m;
      proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
      proxy_hide_header Set-Cookie;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 3600s;
      proxy_cache_lock_age 3600s;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_connect_timeout 30s;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
      proxy_buffering on;
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
