# Press-and-hold accents (ERGON-79): the omacento addon, built from
# packages/pkgbuild/fcitx5-omacento. Hold a key past HoldTime (its own timer,
# not the key repeat) and the popup offers that key's accents, numbered; a
# digit, or the arrows and Enter, picks one; Esc keeps the plain letter. A tap
# is handed back to the application as the key itself.
#
# NOT LINKED, and not read by fcitx5 from here. lib/accents.sh renders
# ~/.config/fcitx5/conf/omacento.conf from this file plus the choices
# `ergon accents` keeps in ~/.config/ergon/accents -- on every sync
# (install.sh) and on every `ergon accents` change. So this is the DEFAULT, a
# change to the table below reaches a machine whatever its owner chose, and
# what its owner chose survives the next sync. It used to be a link, which
# made the supported way to turn the popup off an edit to the checkout.
#
# On everywhere by default, terminals included (the operator's call,
# 2026-10-13); `ergon accents off`, `skip`, and `hold` change that per person.
# A person can change the two keys below, and [Blocklist] -- which is theirs
# alone and does not belong in this file: the render writes it from their
# skip list and drops one found here.
Enabled=True
HoldTime=250

# Spanish first, because that is what this machine's author writes: the es
# preset puts the accents Spanish uses on 1 and 2. Language only takes effect
# while Table below is empty -- Table REPLACES the preset, it does not extend
# it -- so it stays here as the fallback someone gets by deleting the table.
Language=es

# The es preset as omacento 1.1.1 ships it (addon/src/presets.cpp), plus the
# two characters Spanish needs that no preset has: hold ? for ¿ (1) and ¡ (2).
#
# Both on ?, and not ¡ on !, for a reason in the addon: while the popup is
# open, a press of the HELD key is taken for auto-repeat and swallowed
# (sameKey, by keycode). ! is Shift+1 on a US keyboard, so the 1 that picks
# the first accent would be that same key, and nothing would happen.
#
# ? is Shift+/ there, and omacento allows Shift (only Ctrl, Alt, Super, Hyper
# and Mod5 make a key a shortcut it leaves alone). The popup outlives the
# release: let go of Shift before the digit, or 1 arrives as ! and the plain ?
# is kept.
#
# Keyed by the CHARACTER a key produces, not by the key, so this is the same
# table on every layout -- on latam, ¿ and ¡ have keys of their own anyway.
# Lowercase only: omacento derives the uppercase half.
[Table]
0=a á à ä â ã å
1=e é è ë ê ē
2=i í ì ï î
3=o ó ò ö ô õ ø
4=u ú ü ù û
5=n ñ ń
6=c ç ć
7=y ý ÿ
8=? ¿ ¡
