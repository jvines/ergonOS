# fcitx5's X11 module, which serves XIM to XWayland clients (ERGON-79).
#
# Its default is to PUSH the input method group's layout onto the X server it
# is connected to (modules/xcb/xcbkeyboard.cpp: on every group change,
# setLayoutByName(group default layout)). Here that server is XWayland, whose
# keymap Hyprland already sets from kb_layout -- so a latam or es machine
# would have had every X11 window (ds9, topcat, anything Tk or Java) typing
# on fcitx5's "us" while every Wayland window typed on the real layout.
# The layout is the compositor's to set, and only the compositor's.
Allow Overriding System XKB Settings=False
