# fcitx5's keyboard engine, the one input method in the group (ERGON-79).
#
# fcitx5's OWN long press. Rejected for this machine and pinned off, so that a
# future default cannot switch it on behind omacento: it fires on the first
# key repeat, so the popup delay and the repeat delay are one number, and it
# picks by committing the letter and then calling deleteSurroundingText --
# which Chromium on Wayland drops without an error, leaving "eé" behind.
# omacento runs its own timer and never commits early, so there is nothing to
# delete.
#
# Above the sections on purpose: in this format a key belongs to the last
# section header before it, and down there it would be read as part of a
# hotkey list and the setting itself left at its default.
EnableLongPress=False

# Hint mode completes words from a spell dictionary on Control+Alt+H, or once
# on Control+Alt+J; both are application chords this machine leaves to the
# application. An empty section is an empty list.
[Hint Trigger]

[One Time Hint Trigger]
