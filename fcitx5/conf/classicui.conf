# The accent popup is drawn by fcitx5's classic UI (ERGON-79).
#
# Follow the session's light/dark choice -- the colour-scheme key
# `ergon theme --gsettings` writes, which fcitx5 reads through the settings
# portal -- rather than a light popup on a dark palette. fcitx5 ships both
# themes; nothing is generated.
UseDarkTheme=True
# fcitx5's stock "Sans 10" is small beside a terminal at the same nominal
# size; omacento's author measured that and settled on 14.
Font="Sans 14"
