# The suites that actually prove something, on a timer.
#
# test-arch-vm.sh installs from the real Arch ISO under OVMF and boots the
# result; test-hypr-session.sh provisions that disk, starts the compositor and
# clicks a waybar button through /dev/uinput. Together ~35 minutes. That is
# exactly why they get skipped by a human under time pressure, and exactly what
# has caught the bugs that cost whole runs: a command committed 644, a grub.d
# script that became entry 0, a systemd unit that ran even when its target
# failed, git refusing to read a checkout it thought belonged to someone else.
#
# Weekly rather than per-push: 35 minutes of a 16-core box every commit would
# make the machine unusable for the person trying to work on it, and these
# suites test the installer, which does not change most days. Run it by hand
# (workflow_dispatch) after touching anything under bin/arch-bootstrap.sh,
# bin/provision-arch.sh or install.sh.
name: vm

on:
  schedule:
    # Monday 04:00 America/Santiago. Forgejo evaluates cron in UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:
  # And on any push that touches what this suite actually tests. A weekly run
  # catches rot; it does not catch the change that broke the installer, which is
  # found on the following Monday against a week of other commits.
  #
  # Narrow on purpose. These are the files whose failure mode is "the machine
  # does not come up", where the feedback is worth 35 minutes of a runner. A
  # README change is not.
  push:
    branches: [main]
    paths:
      - 'bin/arch-bootstrap.sh'
      - 'bin/provision-arch.sh'
      - 'bin/test-arch-vm.sh'
      - 'bin/test-hypr-session.sh'
      - 'install.sh'
      # The renderer and the user-file creator are install-blocking now: if
      # either fails, install.sh aborts and the machine has no desktop. A
      # change to them belongs in the same bucket as a change to install.sh
      # itself, which is what this list already says is worth 35 minutes.
      - 'bin/ergon-theme'
      - 'lib/user-config.sh'
      # The surfaces the session suite now switches palette against. Without
      # them the assertion added for ERGON-33 could only ever fail on the
      # Monday after the change that broke it. theme/*.env and not theme/**:
      # theme/backgrounds holds the wallpapers, and a new image is not worth
      # thirty-five minutes of a runner.
      - 'theme/*.env'
      - 'mako/**'
      - 'swayosd/**'
      # waybar for the same reason: the session block asserts the bar comes
      # BACK from the restart a palette switch does to it, and the fast gate
      # can only parse its stylesheet -- it cannot tell you the bar mapped a
      # surface, which is what a bad @import costs.
      - 'waybar/**'
      - 'packages/**'
      - 'test/arch-vm/**'
      - '.forgejo/workflows/vm.yml'

concurrency:
  # Never two at once: they would fight over the same qcow2 and over /dev/kvm.
  # NOT cancel-in-progress -- killing a 30-minute run to start another wastes
  # the half hour already spent and leaves a half-written disk behind.
  group: vm
  cancel-in-progress: false

jobs:
  install:
    name: ISO install, boot assertions, desktop session
    runs-on: checo
    env:
      CI_DIR: /home/jayvains/ci-runs/ergonos-vm-${{ github.run_id }}
      REMOTE: ssh://git@git.jvines.cl:2222/jayvains/ergonOS.git
      # Alertmanager on chiki. Its one route sends everything it receives to
      # Telegram, which is the whole difference between a suite that is red and
      # a suite somebody knows is red -- and for a weekly job nobody is sitting
      # in front of, that is the difference between a test and a decoration.
      #
      # An IP literal, not alertmanager.jvines.cl: pihole answers EVERY
      # *.jvines.cl name with 192.168.0.25, so a name here would prove nothing
      # and would add a DNS hop that can be down at 04:00 on a Monday. Not a
      # secret either -- this is an RFC1918 address, and a secret that is
      # missing expands to the empty string with no error, which is this step
      # failing silently, which is the bug being fixed.
      ERGON_ALERT_URL: http://192.168.0.25:9093
      # Deliberately OUTSIDE CI_DIR. Clean up deletes the checkout, and the
      # step that tells you the job failed has to run after it -- Clean up has
      # its own history of being the thing that failed. Refreshed from the
      # commit under test on every run, so it is never older than the last run
      # that got as far as cloning.
      ALERTER: /home/jayvains/ci-runs/.ergon-alert
      # Its own disk. The default is ~/.cache/fleet-artifacts/arch-vm, which is
      # the disk a person tests against by hand -- a CI run rebuilding it
      # mid-week would silently destroy their provisioned VM.
      WORK: /home/jayvains/ci-vm/arch-vm
    steps:
      - name: Preconditions
        run: |
          set -euo pipefail
          # Fail here, naming the cause, rather than twelve minutes in.
          [ -c /dev/kvm ] || { echo "/dev/kvm is missing -- the runner cannot virtualise" >&2; exit 1; }
          docker image inspect fleet-qemu >/dev/null 2>&1 \
            || { echo "the fleet-qemu image is missing on this runner" >&2; exit 1; }
          avail=$(df -BG --output=avail /home | tail -1 | tr -dc '0-9')
          [ "${avail:-0}" -ge 40 ] \
            || { echo "only ${avail}G free on /home; a run needs about 40G" >&2; exit 1; }
          echo "kvm, fleet-qemu and ${avail}G free"

      - name: Check out the commit under test
        run: |
          set -euo pipefail
          rm -rf "$CI_DIR"
          mkdir -p "$(dirname "$CI_DIR")"
          git clone --quiet "$REMOTE" "$CI_DIR"
          cd "$CI_DIR"
          git checkout --quiet "${{ github.sha }}"
          # Only if there is none yet. checks.yml installs this file after
          # ./bin/test-alert.sh has passed on it; overwriting that with the
          # copy from an arbitrary commit would put an unvalidated notifier in
          # the one place that has to work when everything else has failed.
          [ -x "$ALERTER" ] || install -Dm755 "$CI_DIR/bin/ergon-alert" "$ALERTER"
          echo "testing $(git rev-parse --short HEAD)"

      # --keep leaves the disk behind, because the session suite provisions
      # that same disk rather than installing its own. The old logs go first:
      # WORK is a fixed path, and a run that never reached Clean up (a cancel,
      # a watchdog reset) leaves its own, to be read below as this run's.
      - name: Install from the ISO and assert against the booted system
        id: install
        run: |
          rm -f "$WORK"/phase[123].log "$WORK"/session.log
          cd "$CI_DIR" && ./bin/test-arch-vm.sh --keep

      - name: Provision it and prove the desktop works
        id: session
        run: cd "$CI_DIR" && ./bin/test-hypr-session.sh

      # The steps above show only the ok/FAIL lines. What a failing check prints
      # to explain itself goes to the console log under $WORK, and the next step
      # deletes $WORK -- so the hyprpaper diagnosis written for exactly this was
      # printed, saved, and thrown away, run after run. Print it here first,
      # from the log of the step that failed, not whichever log happens to exist.
      - name: Show what the failing checks said
        if: failure()
        env:
          INSTALL: ${{ steps.install.outcome }}
          SESSION: ${{ steps.session.outcome }}
        run: |
          s="$WORK/session.log"
          if [ "$INSTALL" = failure ]; then
            # A phase is read by its verdict line, never by its end: the end of
            # every phase that got that far is its poweroff. Where the guest's
            # checks ran and failed, show what the guest printed from its
            # script's launch to the verdict -- the cmdline and the default
            # subvolume are printed there to read a FAIL against. Where no
            # verdict came, the end is where it stopped. The runner's bash has
            # -e and pipefail, hence the || true.
            for n in 1 2 3; do
              f="$WORK/phase$n.log"
              [ -f "$f" ] || continue
              v=$(grep -aoE '(SERIAL_RC|ASSERT_RESULT|ROLLBACK_RESULT)=[0-9]+' "$f" | tail -1 || true)
              case "$v" in
                *=0) ;;
                *_RESULT=*)
                  echo "--- phase $n said $v:"
                  awk '{ gsub(/\r/, "") }
                    /guest-(assert|rollback-verify)\.sh/ { b = ""; next }
                    { b = b $0 "\n" }
                    /_RESULT=[0-9]/ { printf "%s", b; b = "" }' "$f" | tail -80 ;;
                *)
                  echo "--- phase $n never reached its verdict; the end of $f:"
                  tr -d '\r' < "$f" | tail -40 ;;
              esac
            done
            ls "$WORK"/phase?.log >/dev/null 2>&1 \
              || echo "no phase log: it failed before the first boot, and says why above"
          elif [ "$SESSION" != failure ]; then
            echo "neither test step failed: the step that did says why, above"
          elif [ -f "$s" ] && grep -q 'DESKTOP_RESULT=' "$s"; then
            # Each FAIL with the lines it printed under itself, then the
            # compositor log the suite dumps whenever anything failed.
            tr -d '\r' < "$s" | awk '
              /^   FAIL /             { show = 1; print; next }
              /^   --- hyprland\.log/ { show = 1 }
              /^(   ok |   --   |--- )/ { show = 0 }
              show'
          elif [ -f "$s" ]; then
            echo "the desktop test never finished; the end of its console:"
            tr -d '\r' < "$s" | tail -60
          else
            echo "the desktop test failed before it wrote $s; its output is above"
          fi

      - name: Clean up
        if: always()
        run: |
          # The disk is ~20G and nothing reads it between runs: the next run
          # reinstalls from the ISO anyway. Keeping it would cost a fifth of
          # /home for nothing.
          #
          # $WORK goes through a container because part of it is root's:
          # test-arch-vm.sh pulls the kernel and initramfs out of the ISO inside
          # docker, as root, and the runner's own rm cannot unlink them. That
          # failed this step, and with it the job, on every run there has been,
          # whatever the tests said.
          rm -rf "$CI_DIR"
          if [ -d "$WORK" ]; then
            docker run --rm --label cl.jvines.owner=ergon-vm-ci \
              -v "$(dirname "$WORK"):/p" fleet-qemu rm -rf "/p/$(basename "$WORK")"
          fi

      # ERGON-12's third criterion, and the one that was never met: a failure
      # is visible without anyone going to look for it. Until this step existed
      # a red Monday reached the Forgejo web UI and nowhere else, so a
      # 35-minute suite could rot for weeks and the first symptom would be
      # three rounds of work standing on it.
      #
      # The green half first, so that its own failure is reportable by the one
      # after it. Both are LAST, after Clean up: failure() is true if ANY
      # earlier step failed, so trailing placement also catches a Clean up that
      # fails -- a step with a history -- and the run this links to already has
      # the diagnosis from "Show what the failing checks said" in it. A
      # cancelled run is not a failed one, so nothing is sent for one.
      - name: And say when it is green again
        if: success()
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          [ -x "$ALERTER" ] || exit 0
          "$ALERTER" --resolve --label workflow=vm ErgonCI \
            "the weekly VM suite is green again on $REF" "$SHA passed."

      - name: Say so somewhere a person will see it
        if: failure()
        env:
          INSTALL: ${{ steps.install.outcome }}
          SESSION: ${{ steps.session.outcome }}
          # Through env, not interpolated into the script: a branch name may
          # carry $( ), a backtick or a semicolon, and interpolation happens
          # before the shell sees the line.
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          # run_number, NOT run_id. Forgejo's web route resolves
          # /actions/runs/<n> by the per-repository index, while github.run_id
          # is the instance-wide primary key -- a URL built from run_id is a
          # 404, which is how ExoAutomata's smoke tests have been filing cards
          # that link nowhere. github.server_url already ends in a slash.
          RUN_URL: ${{ github.server_url }}${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          [ -x "$ALERTER" ] || {
            echo "no notifier at $ALERTER: nobody has been told this run failed" >&2
            exit 1
          }
          case "${INSTALL}:${SESSION}" in
            failure:*) what="the ISO install and its boot assertions" ;;
            *:failure) what="the desktop session suite" ;;
            *)         what="a step outside the two suites" ;;
          esac
          "$ALERTER" --label workflow=vm --url "$RUN_URL" \
            ErgonCI "the weekly VM suite is red -- $what failed" \
            "$REF at $SHA. What the failing checks printed is in the job log: $RUN_URL"
