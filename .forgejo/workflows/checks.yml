# The gate. Runs on every push to main, because every verification in this
# repo's history happened only because someone remembered to run it.
#
# It was the five-second gate until the desktop configs stopped being committed.
# The last step now pulls an Arch image and installs five packages to load each
# generated config through the parser that will actually read it, which costs
# minutes rather than seconds and can fail on a mirror rather than on the
# commit. That was judged worth it: those configs are no longer reviewable in a
# diff, so nothing else looks at them until a VM run or a person's session.
#
# Deliberately does NOT run the VM suites: those take ~35 minutes and need
# /dev/kvm. They are in vm.yml, on a timer.
#
# No `uses:` anywhere. The checo runner is registered in HOST mode
# (self-hosted:host, Linux:host, X64:host, checo:host), so actions run as the
# jayvains user with no container, and the checkout action is not dependable
# there. ExoAutomata's workflow reached the same conclusion; it clones by hand
# too.
name: checks

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run pointless. Keyed by ref so this never
  # cancels the VM workflow.
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: lint, bundles, hardware
    runs-on: checo
    env:
      CI_DIR: /home/jayvains/ci-runs/ergonos-${{ github.run_id }}
      REMOTE: ssh://git@git.jvines.cl:2222/jayvains/ergonOS.git
      # See the same two entries in vm.yml for why this is an IP literal and
      # not a name, and why the notifier is kept outside CI_DIR.
      ERGON_ALERT_URL: http://192.168.0.25:9093
      ALERTER: /home/jayvains/ci-runs/.ergon-alert
    steps:
      - name: Check out the commit under test
        run: |
          set -euo pipefail
          rm -rf "$CI_DIR"
          mkdir -p "$(dirname "$CI_DIR")"
          git clone --quiet "$REMOTE" "$CI_DIR"
          cd "$CI_DIR"
          # The exact commit, not whatever main points at by the time this runs.
          git checkout --quiet "${{ github.sha }}"
          # Armed here, but only if there is nothing to arm. "Keep the notifier
          # that just passed" below is what normally installs this, after
          # ./bin/test-alert.sh -- which is the tenth step, so on a runner that
          # has never got that far there would be no notifier at all, and the
          # first failing run would report itself to the web UI and nowhere
          # else. An unvalidated notifier beats none; a validated one replaces
          # it minutes later.
          [ -x "$ALERTER" ] || install -Dm755 "$CI_DIR/bin/ergon-alert" "$ALERTER"
          echo "testing $(git rev-parse --short HEAD)"

      # The themed configs are generated and gitignored, so what CI clones has
      # none of them. Rendering here is cheap (about a third of a second) and
      # proves the templates still expand -- an undefined @COOL_X@ is a hard
      # error in ergon-theme, and the alternative is finding out from a desktop
      # that will not start.
      #
      # The palette is named explicitly, and both XDG dirs are redirected into
      # the job's own directory. This runner is in HOST mode: $HOME belongs to
      # a real person, ergon-theme records the chosen palette under
      # XDG_STATE_HOME and creates user override files under XDG_CONFIG_HOME,
      # and a CI job has no business touching either. Without the explicit
      # `cool`, it would also render whatever palette that person last chose.
      - name: Render the default palette
        run: |
          cd "$CI_DIR"
          XDG_STATE_HOME="$CI_DIR/.state" XDG_CONFIG_HOME="$CI_DIR/.config" \
            ./bin/ergon-theme --no-apply cool

      - name: ergon-lint
        run: cd "$CI_DIR" && ./bin/ergon-lint

      - name: Bundles
        run: cd "$CI_DIR" && ./bin/test-bundles.sh

      - name: Hardware
        run: cd "$CI_DIR" && ./bin/test-hardware.sh

      - name: CLI --help never runs a command, and ergon new writes JSON
        run: cd "$CI_DIR" && ./bin/test-cli.sh

      # ERGON-38: --audio desktop/mic reach wf-recorder as the right PulseAudio
      # special name, and --audio both refuses instead of silently recording
      # only one side. Stubs wf-recorder, notify-send and slurp.
      - name: Record's --audio argument handling
        run: cd "$CI_DIR" && ./bin/test-record.sh

      # ERGON-15: the first-login welcome is the real commands' output, opens
      # once, never burns its one shot on a window that did not appear, and
      # cannot hold up the login. Stubs the terminal, glow and hyprctl.
      - name: The welcome shows what is here, once, without blocking
        run: cd "$CI_DIR" && ./bin/test-welcome.sh

      # ERGON-61: a failed `ship --fetch` used to skip the fetch entirely --
      # exactly the run whose output you most want back -- and a second
      # `repro --with-data` against the same --out nested a copy inside
      # itself instead of refreshing it. Stubs ssh, rsync and apptainer; no
      # network, never a real ssh.
      - name: Ship fetches a failed run; repro doesn't nest or lie
        run: cd "$CI_DIR" && ./bin/test-ship-repro.sh

      - name: Provisioning reaches installed machines
        run: cd "$CI_DIR" && ./bin/test-provisioning.sh

      - name: Update runs the transaction the way it says
        run: cd "$CI_DIR" && ./bin/test-update.sh

      - name: AUR builds the reviewed commit, and says so honestly
        run: cd "$CI_DIR" && ./bin/test-aur.sh

      - name: The firewall drops inbound, and docker publishes to localhost
        run: cd "$CI_DIR" && ./bin/test-firewall.sh

      - name: A run that exhausts memory is contained, not the session
        run: cd "$CI_DIR" && ./bin/test-oom.sh

      # The notifier that the two steps at the end of this file depend on. It
      # is checked here, on every push, precisely because it only ever runs
      # when something else has already gone wrong -- the one place a silent
      # regression would never be noticed.
      - name: The thing that tells you a run failed, works
        run: cd "$CI_DIR" && ./bin/test-alert.sh

      # Only now. $ALERTER is the copy that outlives Clean up and the one
      # vm.yml uses on Monday, so it must never be replaced by a notifier that
      # has not just passed its own test: a commit that broke ergon-alert would
      # otherwise install the broken one, fail this gate, and then try to
      # report that failure with it.
      - name: Keep the notifier that just passed
        run: install -Dm755 "$CI_DIR/bin/ergon-alert" "$ALERTER"

      # A palette switch reaches the programs that are already running. Opens a
      # real pty to prove the terminal sequences arrive, which needs no display.
      - name: A palette switch reaches the running desktop
        run: cd "$CI_DIR" && ./bin/test-theme.sh

      # And the background follows the palette, which is the half the step above
      # does not touch. The wallpaper is the largest surface on the screen and
      # the only themed one that is not rendered from a .in template, so nothing
      # in the render or parse checks looks at it: it cached on an mtime that a
      # palette switch does not move, and it kept the previous palette's image
      # because that file still existed. Both passed every check in this file.
      # Stubs magick, so it costs no render and needs no imagemagick.
      - name: The background follows the palette
        run: cd "$CI_DIR" && ./bin/test-wallpaper.sh

      # lib/ -- the science tooling, which until now was the only part of this
      # repo with no gate at all. Every step above this line tests the desktop,
      # the installer or the system; none of them imports a single line of the
      # code the README is actually about.
      #
      # Builds its own environment with uv rather than using the runner user's
      # pyfleet venv, so it cannot go red because a person has not run
      # `pyfleet sync`. Cold cache costs a matplotlib download; warm is seconds.
      - name: The science tooling in lib/
        run: cd "$CI_DIR" && ./bin/test-science.sh

      # The Bundles step above stubs pacman, the AUR and pyfleet, so it passes
      # a package Arch renamed and a git pin to a commit that does not exist
      # alike -- and until ERGON-60 nothing else here had ever resolved a
      # bundle. This asks the real indexes, installing nothing: uv compiles
      # each bundle's python and git lines with packages/python and then all of
      # them at once, because pyfleet puts them in one venv, and an Arch
      # container checks every pacman name is a package by that exact name.
      #
      # It can fail on PyPI, GitHub, the AUR or an Arch mirror rather than on
      # the commit -- or on a git pin that an upstream history rewrite has left
      # on no branch -- and it prints what it resolved against. Seconds warm,
      # a few more with a cold uv cache.
      - name: Every bundle resolves against the real indexes
        run: cd "$CI_DIR" && ./bin/test-bundles-resolve.sh

      # Every desktop config through the parser that will actually read it.
      # This existed and was wired into nothing, which is how a config could be
      # rejected by Hyprland and still pass every check in this file.
      #
      # It matters more now than it did: the configs these parsers read are
      # generated rather than reviewed in a diff, and each one carries an
      # include of a user file that mako and fuzzel treat as fatal when absent.
      # The script renders into its own container copy, so it needs nothing
      # from the step above.
      #
      # It is the slow one here -- it pulls an Arch image and installs five
      # packages, so it costs minutes where the rest of this job costs seconds,
      # and it can fail on an Arch mirror rather than on the commit. That is
      # the price of checking the desktop at all without a VM; move it to
      # vm.yml if the gate stops feeling fast.
      - name: Desktop configs parse, by their own parsers
        run: cd "$CI_DIR" && ./bin/test-hypr-config.sh

      # The public mirror is worse than useless when it is stale: someone clones
      # a tree that is weeks behind and hits bugs that were fixed. Pushing it
      # here means it can only ever be behind by a run that FAILED.
      #
      # Uses the github.com-jvines host alias from the runner user's ssh config,
      # which is how this account's key is selected. No secret is needed.
      - name: Mirror to GitHub
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          cd "$CI_DIR"
          git push --quiet git@github.com-jvines:jvines/ergonOS.git \
            "${{ github.sha }}:refs/heads/main"
          echo "mirrored $(git rev-parse --short HEAD) to github.com/jvines/ergonOS"


      - name: Clean up
        if: always()
        run: rm -rf "$CI_DIR"

      # The green half first, so that ITS OWN failure is still reportable by
      # the step below. ergon-alert exits non-zero when a resolve does not
      # take, and a step that fails after the notifier has already been skipped
      # turns the job red and tells nobody -- which is this feature failing in
      # its own shape.
      - name: And say when it is green again
        if: success()
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          [ -x "$ALERTER" ] || exit 0
          "$ALERTER" --resolve --label workflow=checks ErgonCI \
            "the fast gate is green again on $REF" "$SHA passed."

      # main going red is not something to find out from the web UI either.
      # This gate runs on a push someone just made, so most of the time they
      # are still here -- but "most of the time" is how main stays broken over
      # a lunch break, and the mirror step above means a red gate is also the
      # public clone not being updated.
      #
      # Cancelled is not failed, and this workflow cancels in progress on a
      # newer push, so a superseded run says nothing.
      - name: Say so somewhere a person will see it
        if: failure()
        env:
          # Through env rather than interpolated into the script. A branch name
          # may contain $( ), a backtick or a semicolon -- git accepts all
          # three -- and expression interpolation happens before the shell sees
          # the line, so the branch name would be running as the runner user.
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          # run_number, and the slash added here: see vm.yml's alert step.
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_N: ${{ github.run_number }}
        run: |
          RUN_URL="${SERVER_URL%/}/$REPO/actions/runs/$RUN_N"
          [ -x "$ALERTER" ] || {
            echo "no notifier at $ALERTER: nobody has been told this run failed" >&2
            exit 1
          }
          # "did not finish green" rather than "is red": the resolve step above
          # can fail on its own, and this covers that too.
          "$ALERTER" --label workflow=checks --url "$RUN_URL" \
            ErgonCI "the fast gate did not finish green on $REF" \
            "commit $SHA. Which step failed is in the job log: $RUN_URL"
