# btop, pointed at the cool theme.
#
# Only the settings that are a decision are here. btop writes this file itself
# on exit, filling in every default — that is fine and expected; what matters is
# that a fresh machine starts with the palette rather than with btop's red.

#* Name of a btop++ theme file in themes/, without the extension.
color_theme = "cool"

#* If the theme file has truecolor values, use them. Every value in cool.theme
#* is a hex triplet, so this must stay true or they are quantised to 256.
truecolor = True

#* Rounded corners on boxes, to match the compositor's rounding.
rounded_corners = True

#* Show the graph for each core. On a 16-core laptop this is a wall of noise;
#* the aggregate plus per-core percentages is what is actually read.
show_cpu_freq = True
check_temp = True

#* Processes sorted by cpu, and the tree off by default: the question being
#* asked when btop is opened from the bar is almost always "what is eating the
#* machine", not "what is the parentage of this pid".
proc_sorting = "cpu lazy"
proc_tree = False
